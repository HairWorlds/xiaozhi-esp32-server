# ============================================================
# CloudV3 医疗 AI 接入配置（SIT 环境，117.162.7.154）
# 只覆盖需要修改的项，其余从 config.yaml 继承
# ============================================================

# ── 小智服务自身对外 WebSocket 地址（OTA 下发给设备用）─────────
server:
  websocket: wss://tea.iskaola.com/xiaozhi/v1/

# ── 静音断连时间：医疗咨询用户思考时间较长，延至 3 分钟 ────────
close_connection_no_voice_time: 180

# ── 唤醒词 ─────────────────────────────────────────────────
wakeup_words:
  - '你好小智'
  - '小鹿小鹿'
  - '鹿小鹿'

# ── 退出指令 ────────────────────────────────────────────────
exit_commands:
  - '退出'
  - '关闭'
  - '结束问诊'

# ── 角色提示词 ────────如何─────────────────────────────────────
# 注意：实际 AI 角色由 CloudV3 服务端 system prompt 控制；
# 此处提示词用于 xiaozhi 自身行为（开场白、结束语生成等）
prompt: |
  你是一名专业的医疗健康咨询助手，语气温和、耐心、专业。
  核心原则：
  - 回答准确、简洁，每次不超过 100 字
  - 不能替代医生诊断，遇紧急症状务必提示就医
  - 使用标准普通话，语气专业且平易近人
  禁止：
  - 给出具体药物剂量或处方建议
  - 对病情做出确定性诊断

# ── 系统错误提示 ────────────────────────────────────────────
system_error_response: '抱歉，系统暂时繁忙，请稍后重试。若有紧急情况，请立即拨打 120。'

# ── 结束语 ──────────────────────────────────────────────────
end_prompt:
  enable: true
  prompt: |
    请以关心的语气提醒用户注意身体健康、按时服药、定期复查，并礼貌结束本次问诊对话。

# ── 核心模块选择 ────────────────────────────────────────────
# TTS 说明：
#   EdgeTTS      → 依赖 speech.platform.bing.com（国内 Docker 环境可能被墙）
#   SiliconFlowTTS → 硅基流动，国内直连，免费额度，注册: https://cloud.siliconflow.cn
#                   注册后在「API密钥」页面创建密钥，填入下方 access_token
selected_module:
  VAD: SileroVAD # 语音活动检测，保持默认
  ASR: FunASR # 本地语音识别，无需额外费用
  LLM: CloudV3LLM # 指向 CloudV3 医疗 AI 后端
  VLLM: ChatGLMVLLM # 视觉模型保持默认（暂未使用）
  TTS: SiliconFlowTTS # 硅基流动（国内直连）；EdgeTTS 在大陆服务器被墙，已切换
  Memory: nomem # CloudV3 已用 Redis 管理 voice:{deviceId} 会话记忆，本地不重复存储
  Intent: nointent # 医疗问诊无需播放音乐/控制音量，关闭以降低对话延迟

# ── LLM：指向 CloudV3 医疗 AI ────────────────────────────────
LLM:
  CloudV3LLM:
    type: openai
    # OpenAI 客户端自动在 base_url 后追加 /chat/completions
    # 最终请求路径：http://117.162.7.154:8088/chat-api/v1/chat/completions
    # 经网关转发：8088（gateway）→ lb://start（8011）→ OpenAiShimController
    #    base_url: http://117.162.7.154:8088/chat-api/v1
    base_url: http://117.162.7.154:8088/chat-api/v1
    model_name: cloud-medical # shim 层不校验此字段，任意字符串均可
    api_key: df39abac214aba2ec0dcbbad038a0e9169345c881da0f111
    temperature: 0.5 # 医疗场景降低随机性，减少幻觉（与 CloudV3 服务端保持一致）
    max_tokens: 500

# ── TTS ─────────────────────────────────────────────────────
TTS:
  # ① EdgeTTS（当前选中）：温柔专业女声，需访问 speech.platform.bing.com
  EdgeTTS:
    type: edge
    voice: zh-CN-XiaohanNeural # 温柔专业女声；备选：zh-CN-YunjianNeural（男）
    output_dir: tmp/

  # ② 硅基流动 TTS（国内备选，EdgeTTS 无法连通时切换）
  # 切换方法：将上方 selected_module.TTS 改为 SiliconFlowTTS，并填入 access_token
  # 免费注册：https://cloud.siliconflow.cn → 控制台 → API密钥 → 新建密钥
  SiliconFlowTTS:
    type: siliconflow
    access_token: sk-twydhmljriycwgsvuemgwpgbuvrezlxuaiyhgfciferucpir
    model: FunAudioLLM/CosyVoice2-0.5B
    voice: FunAudioLLM/CosyVoice2-0.5B:anna # 女声；备选男声: :alex, :david
    output_dir: tmp/
